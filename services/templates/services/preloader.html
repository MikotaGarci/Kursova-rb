{% load static %}
<style>
    /* Темний фон */
    #preloader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a; 
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Контейнер для силуету та кілець */
    .loader-container {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Зовнішнє золоте кільце */
    .loader-ring {
        width: 100%;
        height: 100%;
        border: 2px solid rgba(205, 163, 79, 0.1);
        border-top: 3px solid #cda34f;
        border-radius: 50%;
        position: absolute;
        top: 0;
        left: 0;
        animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        box-shadow: 0 0 20px rgba(205, 163, 79, 0.3);
    }

    /* Внутрішнє кільце */
    .loader-ring-inner {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border: 1px dashed rgba(205, 163, 79, 0.5);
        border-radius: 50%;
        animation: pulse-ring 2s ease-in-out infinite;
    }

    /* Зображення силуету */
    .silhouette-img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 50%;
        z-index: 2;
    }

    /* Ножиці  */
    .loader-icon {
        position: absolute;
        top: 25%;
        left: -15%;
        font-size: 2.2rem;
        color: #cda34f;
        z-index: 3;
        animation: cut-pulse 1.5s infinite;
        filter: drop-shadow(0px 0px 5px rgba(205, 163, 79, 0.5));
    }

    /* Текст з ефектом металевого блиску */
    .loader-text {
        margin-top: 40px;
        font-family: 'Montserrat', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.2);
        background: linear-gradient(90deg, #cda34f 0%, #fff 50%, #cda34f 100%);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite;
        text-transform: uppercase;
    }

    /* Анімації */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulse-ring {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 1; }
    }

    /* Анімація різання для ножиць */
    @keyframes cut-pulse {
        0%, 100% { transform: scale(1) rotate(60deg); }
        50% { transform: scale(1.15) rotate(45deg); }
    }

    @keyframes shine {
        to { background-position: 200% center; }
    }

    /* Плавне зникнення */
    #preloader-overlay.hidden {
        opacity: 0;
        visibility: hidden;
    }
</style>

<div id="preloader-overlay">
    
    <div class="loader-container">
        <div class="loader-ring"></div>
        <div class="loader-ring-inner"></div>
        
        <img src="{% static 'services/barber.jpg' %}" alt="Silhouette" class="silhouette-img">
        
        <i class="fa-solid fa-scissors loader-icon"></i>
    </div>
    
    <div class="loader-text">Premium Barber</div>
</div>

<script>
    // Скрипт для приховання після завантаження
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('preloader-overlay').classList.add('hidden');
        }, 1500); 
    });
</script>
